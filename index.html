<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>가나 7일 집중 코스</title>
<style>
:root{
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --pp:#6c5ce7;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f5fb;color:#222;
  max-width:480px;margin:0 auto;padding-bottom:72px}
header{background:var(--pp);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:16px}
header .sub{font-size:11.5px;opacity:.92;margin-top:3px;line-height:1.5}
.bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center}
.bar select{padding:6px 8px;border-radius:8px;border:1px solid #ccd;background:#fff;font-size:13px;max-width:100%}
.bar #stat{margin-left:auto;font-size:12px;color:#555}
section{display:none;padding:8px 16px 24px}
section.active{display:block}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.intro{background:#eef0fd;border-left:3px solid var(--pp);border-radius:8px;padding:9px 11px;
  font-size:12.5px;line-height:1.65;margin-bottom:14px;color:#3a3f52}
.intro b{color:var(--pp)}
.big{display:flex;gap:16px;justify-content:center;align-items:baseline}
.big span{font-family:var(--jp);font-size:92px;line-height:1}
.big .kk{color:#8a8fb0}
.rom{text-align:center;font-size:20px;margin:10px 0}
.rom b{color:var(--pp);font-size:24px}
.mn{font-size:14px;line-height:1.6;background:#f6f6fd;border-radius:10px;padding:10px 12px;margin:10px 0}
.mn .tip{color:#555}
.mn b{color:var(--pp)}
.ex{font-size:14px;line-height:1.9}
.ex b{font-family:var(--jp);font-size:19px}
.mark{display:flex;gap:10px;margin-top:14px}
.mark button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px}
#lkno{background:#e3fbe8;color:#1a7a33}
#lfgt{background:#ffe9e9;color:#b23}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.nav2 button{padding:8px 14px;border:1px solid #ccd;background:#fff;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}
.grid span{font-family:var(--jp);font-size:19px;text-align:center;padding:6px 0;border-radius:8px;
  background:#fff;border:1px solid #e2e4f0;color:#999}
.grid span.kn{background:#e3fbe8;border-color:#a9e6b8;color:#1a7a33}
.grid span.cur{outline:2px solid var(--pp)}
.gridnote{margin-top:14px;font-size:12px;color:#888;text-align:center}
.label{text-align:center;font-size:15px;color:#555;margin:6px 0}
.prompt{text-align:center;font-size:34px;margin:4px 0}
.prompt small{font-size:16px;color:#888}
.scriptask{text-align:center;color:var(--pp);font-size:14px;margin-bottom:4px}
.pad{position:relative;width:min(300px,86vw);height:min(300px,86vw);margin:10px auto;
  border:2px dashed #cdd3e8;border-radius:16px;background:#fff;touch-action:none}
.guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--jp);
  font-size:min(210px,60vw);line-height:1;color:#eceefb;pointer-events:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.row{display:flex;gap:10px;justify-content:center;margin-top:6px}
.row button{padding:10px 16px;border:1px solid #ccd;background:#fff;border-radius:10px;font-size:14px}
#bscore{background:var(--pp);color:#fff;border:0}
.result{text-align:center;font-size:16px;margin-top:10px;min-height:22px;font-weight:600}
.result.good{color:#1a7a33}
.result.bad{color:#b23}
.hint{text-align:center;color:#999;font-size:12px;margin-top:8px;line-height:1.5}
.qq{font-family:var(--jp);font-size:82px;text-align:center;margin:24px 0}
.qq.small{font-family:inherit;font-size:32px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopts button{padding:16px;font-size:18px;border:1px solid #ccd;background:#fff;border-radius:12px;
  font-family:var(--jp)}
.qopts button.ok{background:#e3fbe8;border-color:#1a7a33}
.qopts button.no{background:#ffe9e9;border-color:#b23}
.qmeta{text-align:center;color:#666;font-size:13px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;
  background:#fff;border-top:1px solid #e0e0ea}
nav button{flex:1;padding:12px 0;border:0;background:none;font-size:13px;color:#888}
nav button.on{color:var(--pp);font-weight:700}
.tinybtn{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>가나 7일 집중 코스 <button class="tinybtn" id="reset">기록 초기화</button></h1>
  <div class="sub">Day 1~7을 순서대로. 각 Day에서 <b>보기 → 따라쓰기 → 백지 → 퀴즈</b>를 한 바퀴 = 1회독. 약한 글자와 헷갈리는 짝이 더 자주 나옵니다.</div>
</header>

<div class="bar">
  <select id="rangeSel">
    <optgroup label="7일 코스 (누적)">
      <option value="d1">Day 1 · 히라 あ·か·さ행</option>
      <option value="d2">Day 2 · 히라 た·な·は행</option>
      <option value="d3">Day 3 · 히라 ま행~ん</option>
      <option value="d4">Day 4 · 히라 탁음·반탁·요음</option>
      <option value="d5">Day 5 · 가타 ア·カ·サ행</option>
      <option value="d6">Day 6 · 가타 タ·ナ·ハ행</option>
      <option value="d7">Day 7 · 가타 マ행~ン + 탁음·요음</option>
    </optgroup>
    <optgroup label="자유 범위">
      <option value="hira">히라가나 46</option>
      <option value="kata">가타카나 46</option>
      <option value="daku">탁음·반탁음 (양쪽)</option>
      <option value="youon">요음 (양쪽)</option>
      <option value="all">전체 음절 (양쪽)</option>
    </optgroup>
  </select>
  <span id="stat"></span>
</div>

<section id="view-learn" class="active">
  <div class="card">
    <div class="intro" id="lintro"></div>
    <div class="big"><span class="hh" id="lhh"></span><span class="kk" id="lkk"></span></div>
    <div class="rom" id="lrom"></div>
    <div class="mn" id="lmn"></div>
    <div class="ex" id="lex"></div>
    <div class="mark">
      <button id="lkno">✓ 외웠어요</button>
      <button id="lfgt">✗ 다시</button>
    </div>
    <div class="nav2">
      <button id="lprv">← 이전</button><span id="lpos"></span><button id="lnxt">다음 →</button>
    </div>
    <div class="grid" id="lgrid"></div>
    <div class="gridnote" id="lgridnote"></div>
  </div>
</section>

<section id="view-trace">
  <div class="card">
    <div class="label" id="tl"></div>
    <div class="pad"><div class="guide" id="tg"></div><canvas id="tc" width="300" height="300"></canvas></div>
    <div class="row">
      <button id="tclr">지우기</button>
      <button id="tdone">완료 ✓</button>
      <button id="tnext">다음 →</button>
    </div>
    <div class="hint">회색 밑글자를 따라 손가락(또는 마우스)으로 써 보세요.</div>
  </div>
</section>

<section id="view-blank">
  <div class="card">
    <div class="label">이 소리를 가나로 써 보세요</div>
    <div class="prompt" id="bp"></div>
    <div class="scriptask" id="bsa"></div>
    <div class="pad"><div class="guide" id="bg"></div><canvas id="bc" width="300" height="300"></canvas></div>
    <div class="row">
      <button id="bclr">지우기</button>
      <button id="bscore">채점</button>
      <button id="bnext" hidden>다음 →</button>
    </div>
    <div class="result" id="br"></div>
    <div class="hint">채점하면 실제 글자와 겹친 정도(유사도)를 표시합니다. 60% 이상이면 통과.</div>
  </div>
</section>

<section id="view-quiz">
  <div class="card">
    <div class="qmeta" id="qs">이번 세션: 0 / 0</div>
    <div class="qq" id="qq"></div>
    <div class="qopts" id="qo"></div>
  </div>
</section>

<nav>
  <button data-v="learn" class="on">학습</button>
  <button data-v="trace">따라쓰기</button>
  <button data-v="blank">백지쓰기</button>
  <button data-v="quiz">퀴즈</button>
</nav>

<script>
const JP='"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif';

// 청음 46 — h|k|romaji|korean|히라연상|가타연상|히라예|뜻|가타예|뜻
const GOJUON=`
あ|ア|a|아|알파벳 A에 획 하나 더 — 입 크게 '아!'|각진 A, 도끼 모양 '아'|あめ|비|アイス|아이스크림
い|イ|i|이|나란한 앞니 두 개 '이~'|사람이 기대 선 모양 '이'|いぬ|개|インク|잉크
う|ウ|u|우|고개 숙여 '우~' 하고 인사|집 지붕(宀) 아래 '우'|うみ|바다|ウール|양모
え|エ|e|에|목을 쭉 뺀 새가 '에?' 하고 돌아봄|공사장 철골, 한자 工 '에'|えき|역|エアコン|에어컨
お|オ|o|오|'あ'의 형제 — 낚싯바늘에 걸린 오징어|十에 삐침, 가지에 걸린 '오'|おかね|돈|オレンジ|오렌지
か|カ|ka|카|칼(か)로 내리치는 모양, 점은 칼자국|히라가나 か에서 점 뺀 칼|かさ|우산|カメラ|카메라
き|キ|ki|키|열쇠(key) 두 개 겹친 모양|각진 열쇠, き에서 곡선 뺌|きって|우표|キロ|킬로
く|ク|ku|쿠|새 부리로 '꾹' 쪼는 '<' 모양|입 벌린 낫 모양 '쿠'|くつ|신발|クラス|반
け|ケ|ke|케|케이크 자르는 칼과 접시|각진 케이크 칼 '케'|けさ|오늘 아침|ケーキ|케이크
こ|コ|ko|코|입에서 나오는 '코'골이 두 줄|입 벌린 상자 'ㄷ' — 코|こえ|목소리|コーヒー|커피
さ|サ|sa|사|'き'에서 획 뺀 모양, 낚시에 걸린 물고기|각진 さ, 갈퀴 '사'|さかな|물고기|サラダ|샐러드
し|シ|shi|시|낚싯줄이 아래로 쭉 — 갈고리|왼쪽서 위로 두 점+삐침(미소). ツ와 구분: 옆으로|しんぶん|신문|シャツ|셔츠
す|ス|su|스|빙글 도는 소용돌이에 국수 감기|미끄럼틀 타고 '수~'|すし|초밥|スプーン|숟가락
せ|セ|se|세|한자 世(세상 세)에서 온 갈퀴 모양|각진 せ, 갈퀴 '세'|せんせい|선생님|セーター|스웨터
そ|ソ|so|소|지그재그로 꿰맨 '솔기'|점 하나+삐침, 아래로 '소'. ン과 구분: 세로로|そら|하늘|ソース|소스
た|タ|ta|타|논밭(田)에서 온 글자 — 왼쪽 t + 점 두 개|한자 夕(저녁 석), 칼에 점 '타'|たべもの|음식|タオル|수건
ち|チ|chi|치|숫자 5를 뒤집은 지렁이 모양|한자 千(일천 천), 손 흔들며 '치'|ちかてつ|지하철|チーズ|치즈
つ|ツ|tsu|츠|파도가 '츠~' 밀려오는 곡선|위에 두 점 나란히+삐침. シ와 구분: 위로|つくえ|책상|ツアー|투어
て|テ|te|테|한자 手(손 수) — 손 하나 쭉 뻗음|한자 天 비슷, 안테나 '테'|てがみ|편지|テスト|시험
と|ト|to|토|못(と)에 실 한 가닥 걸린 모양|점 하나 찍은 막대, 못 '토'|とけい|시계|トマト|토마토
な|ナ|na|나|십자가에 매듭 — 무릎 꿇고 기도|十에 삐침, 칼 '나'|なつ|여름|ナイフ|나이프
に|ニ|ni|니|왼쪽 막대 + 고리 두 개, 숫자 2(に)|가로줄 두 개, 숫자 2 '니'|にく|고기|ニュース|뉴스
ぬ|ヌ|nu|누|국수(누들)를 젓가락으로 돌돌 — 꼬리 있음(め와 구분)|한자 又에 삐침, 국수 '누'|いぬ|개|ヌードル|누들
ね|ネ|ne|네|고양이(ねこ) 꼬리 말린 모양 — ね·れ·わ 세 자매|복잡한 십자, 제사상 '네'|ねこ|고양이|ネクタイ|넥타이
の|ノ|no|노|동그랗게 도는 'no' 사인, 소용돌이|삐침 하나, 슬래시 '노'|のみもの|음료|ノート|공책
は|ハ|ha|하|'하!' 웃는 옆얼굴 — 막대 + 눈. 조사일 땐 '와'|여덟 八, 벌어진 '하하' 웃음|はな|꽃|ハム|햄
ひ|ヒ|hi|히|웃는 입꼬리 옆모습 '히'|숟가락, 한자 匕(비수 비) '히'|ひこうき|비행기|ヒーロー|히어로
ふ|フ|fu|후|후지산 실루엣, '후~' 부는 바람|갈고리 하나, '후~' 부는 입|ふゆ|겨울|フォーク|포크
へ|ヘ|he|헤|산 능선 — 방귀(へ) 소리 '헤~'|히라가나 へ와 똑같음, 산 능선|へや|방|ヘア|헤어
ほ|ホ|ho|호|'は'에 획 하나 더 — 돛단배의 돛|한자 木(나무 목)에 점, 돛대 '호'|ほし|별|ホテル|호텔
ま|マ|ma|마|실타래 감는 모양 — 엄마가 뜨개질|삼각 매듭, 마스크 '마'|まど|창문|マスク|마스크
み|ミ|mi|미|숫자 3처럼 구불구불 '미'|가로줄 세 개, 숫자 3 '미'|みず|물|ミルク|우유
む|ム|mu|무|소가 '무~' 우는 얼굴, 꼬리 달린 3|입 삐죽 내민 소 '무~'|むし|벌레|ムード|무드
め|メ|me|메|한자 目(눈 목) — ぬ와 달리 꼬리 없음|가위표 X, 눈(目) '메'|めがね|안경|メール|이메일
も|モ|mo|모|'し'에 가로줄 두 개 — 낚싯바늘에 지렁이|한자 毛(터럭 모), 갈퀴에 가로 '모'|もり|숲|モデル|모델
や|ヤ|ya|야|야구 방망이 휘두르는 모양|화살촉 모양 '야'|やま|산|タイヤ|타이어
ゆ|ユ|yu|유|물고기가 구부러진 몸통으로 헤엄|그릇 모양, U턴 '유'|ゆき|눈(雪)|ユーモア|유머
よ|ヨ|yo|요|낚싯바늘에 매듭 — 숫자 4 비슷|빗 모양 'ㅌ', 뒤집힌 3 '요'|よる|밤|ヨガ|요가
ら|ラ|ra|라|'5'를 흘려 쓴 모양 — 라디오 안테나|위 가로줄+갈고리, 라디오 '라'|らいねん|내년|ラーメン|라멘
り|リ|ri|리|두 획 나란히 — 리본 두 가닥|두 획 나란, 사람 옆모습 '리'|りんご|사과|リボン|리본
る|ル|ru|루|빙글 돌아 고리 매듭 — 루프(loop)|두 다리로 서서 '루'|はる|봄|ルール|규칙
れ|レ|re|레|ね·れ·わ 자매 — 꼬리가 밖으로 튕김|체크 표시 ✓, 갈고리 '레'|はれ|맑음|レモン|레몬
ろ|ロ|ro|로|'る'에서 고리 뺀 각진 소용돌이|네모난 입, 상자 '로'|ふろ|목욕|ロボット|로봇
わ|ワ|wa|와|ね·れ·わ 자매 — 고리 없이 부드럽게|입 벌린 상자(ク 비슷), 아래 각 '와'|わたし|나|ワイン|와인
を|ヲ|wo|오|조사 '~을/를' 전용 — 갈퀴에 매듭|ラ에 가로줄 하나 — 거의 안 씀|ほんをよむ|책을 읽다|—|—
ん|ン|n|ㄴ/ㅁ/ㅇ|받침 소리 — 흘려 쓴 h 또는 숫자 6. 어두에 안 옴|삐침+아래에서 위로 점 — 받침 'ㄴ'. ソ와 구분: 밑에서 위로|ほん|책|パン|빵
`.trim().split('\n').map(l=>{const p=l.split('|');return{h:p[0],k:p[1],r:p[2],ko:p[3],hm:p[4],km:p[5],he:p[6],hek:p[7],ke:p[8],kek:p[9]};});

// 탁음·반탁음 25 — h|k|romaji|korean|히라예|뜻|가타예|뜻
const DAKUTEN=`
が|ガ|ga|가|がっこう|학교|ガム|껌
ぎ|ギ|gi|기|かぎ|열쇠|ギター|기타
ぐ|グ|gu|구|かぐ|가구|グラス|유리컵
げ|ゲ|ge|게|げんき|기운|ゲーム|게임
ご|ゴ|go|고|ごはん|밥|ゴリラ|고릴라
ざ|ザ|za|자|ざっし|잡지|ピザ|피자
じ|ジ|ji|지|じかん|시간|ジュース|주스
ず|ズ|zu|즈|みず|물|ズボン|바지

/* ---------- 7일 코스 정의 ---------- */
const G_=(a,b,sc)=>GOJUON.slice(a,b).map(e=>({e,sc}));
const D_=sc=>DAKUTEN.map(e=>({e,sc}));
const Y_=sc=>YOUON.map(e=>({e,sc}));
const DAYS={
  d1:G_(0,15,'h'),
  d2:G_(15,30,'h'),
  d3:G_(30,46,'h'),
  d4:D_('h').concat(Y_('h')),
  d5:G_(0,15,'k'),
  d6:G_(15,30,'k'),
  d7:G_(30,46,'k').concat(D_('k'),Y_('k')),
};
const DAYORDER=['d1','d2','d3','d4','d5','d6','d7'];
const INTRO={
  d1:"<b>Day 1 · 히라가나 15자.</b> あ·い·う·え·お 5모음이 모든 글자의 뼈대. か행·さ행은 「자음+모음」 규칙. 오늘은 소리↔모양만 연결하면 성공.",
  d2:"<b>Day 2 · 히라가나 15자.</b> た행에서 <b>ち(치)·つ(츠)</b>는 규칙을 벗어나니 따로 챙기기. は행의 は는 조사로 쓰이면 「와」.",
  d3:"<b>Day 3 · 히라가나 16자 → 46자 완성.</b> 헷갈리는 짝: <b>ね·れ·わ</b> / <b>ぬ·め</b>. を는 「~을/를」 전용, ん은 받침.",
  d4:"<b>Day 4 · 탁음·반탁음·요음 (규칙 위주).</b> 새 모양 없음. ゛=흐린 소리(か→が, さ→ざ, は→ば), ゜=は행→ぱ행. 작은 <b>ゃゅょ</b>는 앞 い단 글자와 합쳐 한 박자: きゃ=「캬」. 히라가나 전체 복습도 함께.",
  d5:"<b>Day 5 · 가타카나 15자.</b> 소리는 히라가나와 완전히 동일, 모양만 각짐. 카드의 히라가나 연상과 비교하며 외우기. <b>シ·ツ</b>는 획 방향으로 구분.",

  kata:"가타카나 46자 자유 연습.",
  daku:"탁음·반탁음 — 히라가나·가타카나 양쪽.",
  youon:"요음(拗音) — 히라가나·가타카나 양쪽. 작은 ゃゅょ 조합.",
  all:"전체 음절 — 히라·가타 모든 글자.",

/* ---------- 상태 ---------- */
let prog=JSON.parse(localStorage.getItem('kana_prog')||'{}');
const save=()=>localStorage.setItem('kana_prog',JSON.stringify(prog));
const pk=it=>it.sc+':'+it.e.r;                 // 진도 키 = 스크립트별
const known=it=>(prog[pk(it)]||0)>=3;
const chOf=it=>it.sc==='h'?it.e.h:it.e.k;

let range='d1', POOL=[], li=0, lastKey=null;
const $=id=>document.getElementById(id);

function buildPool(){
  if(range[0]==='d'){
    const idx=DAYORDER.indexOf(range);
    POOL=DAYORDER.slice(0,idx+1).flatMap(d=>DAYS[d]);
  }else{
    POOL={
      hira:GOJUON.map(e=>({e,sc:'h'})),
      kata:GOJUON.map(e=>({e,sc:'k'})),
      daku:DAKUTEN.flatMap(e=>[{e,sc:'h'},{e,sc:'k'}]),
      youon:YOUON.flatMap(e=>[{e,sc:'h'},{e,sc:'k'}]),
      all:GOJUON.concat(DAKUTEN,YOUON).flatMap(e=>[{e,sc:'h'},{e,sc:'k'}]),
    }[range];
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// 약한 글자 가중: 미학습 ~5, streak1 ~4, streak2 ~3, 익힘 ~1
function pick(){
  const w=POOL.map(it=>{const s=prog[pk(it)]||0;return Math.max(1,4-Math.min(s,3))+(s>=3?0:1);});
  let sum=w.reduce((a,b)=>a+b,0), x=Math.random()*sum, out=POOL[POOL.length-1];
  for(let i=0;i<POOL.length;i++){x-=w[i];if(x<=0){out=POOL[i];break;}}
  if(pk(out)===lastKey&&POOL.length>1)return pick();
  lastKey=pk(out); return out;
}

function updateStats(){
  const kn=POOL.filter(known).length;
  $('stat').textContent=kn+' / '+POOL.length+' 익힘';
  if($('view-learn').classList.contains('active'))renderGrid();
}

/* ---------- 학습 ---------- */
function renderLearn(){
  li=(li+POOL.length)%POOL.length;
  const it=POOL[li], e=it.e;
  $('lintro').innerHTML=INTRO[range]||'';
  $('lhh').textContent=e.h; $('lkk').textContent=e.k;
  $('lrom').innerHTML=e.r+' · <b>'+e.ko+'</b>';
  const isYou=/[ゃゅょ]/.test(e.h);
  $('lmn').innerHTML = e.hm
    ? '<div><b>ひらがな</b> '+e.hm+'</div><div><b>カタカナ</b> '+e.km+'</div>'
    : isYou
      ? '<div class="tip">작은 <b>ゃ·ゅ·ょ</b>는 앞의 い단 글자와 합쳐 <b>한 박자</b>로 발음. きゃ = き+ゃ → 「캬」. 이미 아는 두 글자의 조합이라 새로 외울 모양은 없음.</div>'
      : '<div class="tip">탁점 ゛ : 맑은소리 → 흐린소리 (か→が, さ→ざ, た→だ, は→ば). 반탁점 ゜ : は행 → ぱ행. 모양은 기본 글자 그대로.</div>';
  let ex='ひらがな 예 <b>'+e.he+'</b> — '+e.hek;
  if(e.ke && e.ke!=='—') ex+='<br>カタカナ 예 <b>'+e.ke+'</b> — '+e.kek;
  $('lex').innerHTML=ex;
  $('lpos').textContent=(li+1)+' / '+POOL.length+'  ('+(it.sc==='h'?'히라가나':'가타카나')+')';
  renderGrid();
}
function renderGrid(){
  const g=$('lgrid'), note=$('lgridnote');
  if(POOL.length>50){ g.innerHTML=''; note.textContent='총 '+POOL.length+'자 · 익힘 '+POOL.filter(known).length+'자 (그리드 생략)'; return; }
  note.textContent=''; g.innerHTML='';
  POOL.forEach((it,i)=>{
    const s=document.createElement('span');
    s.textContent=chOf(it); if(known(it))s.className='kn';
    if(i===li)s.classList.add('cur');
    s.onclick=()=>{li=i;renderLearn();scrollTo(0,0);};
    g.appendChild(s);
  });
}
$('lkno').onclick=()=>{prog[pk(POOL[li])]=3;save();li++;renderLearn();updateStats();};
$('lfgt').onclick=()=>{prog[pk(POOL[li])]=0;save();renderLearn();updateStats();};
$('lprv').onclick=()=>{li--;renderLearn();};
$('lnxt').onclick=()=>{li++;renderLearn();};

/* ---------- 캔버스 ---------- */
function bindPad(cv){
  const ctx=cv.getContext('2d');
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=16;ctx.strokeStyle='#1e2b4d';
  let drawing=false,last=null,dirty=false;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true;});
  const end=()=>drawing=false;
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,end));
  return{ctx,clear(){ctx.clearRect(0,0,cv.width,cv.height);dirty=false;},get dirty(){return dirty;}};
}
// ponytail: 유사도 = 실제 글자 글리프와 손글씨의 픽셀 겹침 F1. 획 순서/모양은 안 봄.
//           더 정확히 하려면 $1 unistroke recognizer로 교체.
function similarity(cv,ch){
  const W=cv.width,H=cv.height;
  const off=document.createElement('canvas');off.width=W;off.height=H;
  const o=off.getContext('2d');
  o.fillStyle='#000';o.textAlign='center';o.textBaseline='middle';
  o.font=(ch.length>1?140:220)+'px '+JP;
  o.fillText(ch,W/2,H/2);
  const T=o.getImageData(0,0,W,H).data, U=cv.getContext('2d').getImageData(0,0,W,H).data;
  let inter=0,t=0,u=0;
  for(let i=3;i<T.length;i+=4){
    const tp=T[i]>40,up=U[i]>40;
    if(tp)t++; if(up)u++; if(tp&&up)inter++;
  }
  if(!t||!u)return 0;
  const cov=inter/t, prec=inter/u;
  return Math.round(100*2*cov*prec/(cov+prec));
}
const guideSize=ch=>ch.length>1?'min(140px,40vw)':'';

/* ---------- 따라쓰기 ---------- */
const tpad=bindPad($('tc'));
let tItem,tCh;
function newTrace(){
  tItem=pick(); tCh=chOf(tItem);
  $('tg').textContent=tCh; $('tg').style.fontSize=guideSize(tCh);
  $('tl').textContent=tItem.e.ko+' · '+tItem.e.r+'  ('+(tItem.sc==='h'?'ひらがな':'カタカナ')+')';
  tpad.clear();
}
$('tclr').onclick=()=>tpad.clear();
$('tnext').onclick=newTrace;
$('tdone').onclick=()=>{
  const key=pk(tItem);
  if((prog[key]||0)<2)prog[key]=(prog[key]||0)+1; // 따라쓰기는 최대 2까지만
  save();updateStats();newTrace();
};

/* ---------- 백지쓰기 ---------- */
const bpad=bindPad($('bc'));
let bItem,bCh;
function newBlank(){
  bItem=pick(); bCh=chOf(bItem);
  $('bp').innerHTML=bItem.e.ko+' <small>('+bItem.e.r+')</small>';
  $('bsa').textContent='→ '+(bItem.sc==='h'?'ひらがな':'カタカナ')+'로 쓰기';
  $('bg').textContent=''; $('bg').style.fontSize=guideSize(bCh);
  bpad.clear();
  $('br').textContent=''; $('br').className='result';
  $('bnext').hidden=true; $('bscore').hidden=false;
}
$('bclr').onclick=()=>bpad.clear();
$('bnext').onclick=newBlank;
$('bscore').onclick=()=>{
  if(!bpad.dirty){$('br').textContent='먼저 써 보세요';return;}
  const s=similarity($('bc'),bCh);
  $('bg').textContent=bCh;
  $('br').textContent='유사도 '+s+'%   ·   정답 '+bCh;
  $('br').className='result '+(s>=60?'good':'bad');
  if(s>=60){const key=pk(bItem);prog[key]=Math.min(3,(prog[key]||0)+1);}
  save();updateStats();
  $('bnext').hidden=false; $('bscore').hidden=true;
};

/* ---------- 퀴즈 ---------- */
const CONFUSE={shi:['tsu'],tsu:['shi'],so:['n'],n:['so'],nu:['me'],me:['nu'],
  wa:['re','ne'],re:['wa','ne'],ne:['re','wa'],ku:['wa'],ru:['ro'],ro:['ru'],
  a:['o'],o:['a'],ha:['ho'],ho:['ha'],ki:['sa'],sa:['ki']};
function distractors(ans){
  const same=POOL.filter(it=>it.sc===ans.sc && it.e.r!==ans.e.r && it.e.ko!==ans.e.ko);
  const conf=(CONFUSE[ans.e.r]||[]).flatMap(r=>same.filter(it=>it.e.r===r));
  const rest=shuffle(same.filter(it=>!conf.includes(it)));
  return [...conf,...rest].slice(0,3);
}
let qsess={c:0,t:0};
function newQuiz(){
  const ans=pick(), sc=ans.sc, modeB=Math.random()<.5;
  const opts=shuffle([ans,...distractors(ans)]);
  const qq=$('qq'), qo=$('qo');
  qq.classList.toggle('small',modeB);
  qq.textContent = modeB ? ans.e.ko+' ('+ans.e.r+')' : (sc==='h'?ans.e.h:ans.e.k);
  qo.innerHTML=''; qo.dataset.done='';
  opts.forEach(it=>{
    const b=document.createElement('button');
    b.textContent = modeB ? (sc==='h'?it.e.h:it.e.k) : it.e.ko+' ('+it.e.r+')';
    b.onclick=()=>{
      if(qo.dataset.done)return; qo.dataset.done='1'; qsess.t++;
      const key=pk(ans);
      if(it===ans){b.classList.add('ok');qsess.c++;prog[key]=Math.min(3,(prog[key]||0)+1);}
      else{b.classList.add('no');prog[key]=0;
        [...qo.children].forEach((c,i)=>{if(opts[i]===ans)c.classList.add('ok');});}
      save();updateStats();
      $('qs').textContent='이번 세션: '+qsess.c+' / '+qsess.t;
      setTimeout(newQuiz,950);
    };
    qo.appendChild(b);
  });
}

/* ---------- 라우팅 / 컨트롤 ---------- */
const views={learn:renderLearn,trace:newTrace,blank:newBlank,quiz:newQuiz};
document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick=()=>{
    const v=btn.dataset.v;
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===btn));
    document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
    views[v]();
  };
});
const refreshActive=()=>views[document.querySelector('section.active').id.replace('view-','')]();
$('rangeSel').onchange=e=>{range=e.target.value;buildPool();li=0;updateStats();refreshActive();};
$('reset').onclick=()=>{if(confirm('학습 기록을 모두 지울까요?')){prog={};save();updateStats();refreshActive();}};

buildPool();renderLearn();updateStats();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
