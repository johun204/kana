<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>가나 게임</title>
<style>
:root{
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --pp:#6c5ce7;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f5fb;color:#222;
  max-width:480px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{background:var(--pp);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:16px;flex:1}
header .hstat{font-size:12px;opacity:.95;white-space:nowrap}
.iconbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:5px 9px;font-size:13px}
section{display:none;padding:10px 16px 28px}
section.active{display:block}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.furi{display:inline-flex;align-items:flex-end;gap:1px;vertical-align:middle;margin:0 2px;flex-wrap:wrap;justify-content:center}
.fu{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.fr{font-size:12px;color:var(--pp);height:14px}
.fk{font-family:var(--jp);font-size:30px}
.sp{display:inline-block;width:7px}

/* 홈 · 모드 선택 */
.modecard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 12px;
  margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.modecard:active{background:#f6f6fd}
.micon{font-size:28px;width:44px;height:44px;border-radius:50%;background:#f0f0fb;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.minfo{flex:1;min-width:0}
.minfo b{font-size:15px}
.minfo small{color:#888;font-size:12px}
.mbest{font-size:12px;color:#f0a500;white-space:nowrap;font-weight:700}

/* 게임 화면 */
.ghud{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:6px}
.ghud .hearts{flex:1}
.ghud .gscore{font-weight:700;color:var(--pp)}
.ghud .gcombo{color:#e67e22;font-weight:700;min-width:38px;text-align:right}
.timerwrap{height:6px;background:#e2e4f0;border-radius:3px;overflow:hidden;margin-bottom:14px}
.timerfill{height:100%;width:100%;background:var(--pp)}
.timerfill.frozen{background:#ccd}
.prompt{text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prompt.big{font-family:var(--jp);font-size:78px}
.prompt.reading{font-size:30px;color:var(--pp);font-weight:700}
.prompt.reading small{font-size:15px;color:#888;font-weight:400;display:block;margin-top:4px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.qopts button{padding:16px 8px;font-size:17px;border:1px solid #ccd;background:#fff;border-radius:12px}
.qopts.jpopts button{font-family:var(--jp);font-size:26px}
.qopts button.ok{background:#e3fbe8;border-color:#1a7a33;box-shadow:0 0 0 2px #1a7a33 inset}
.qopts button.no{background:#ffe9e9;border-color:#b23;box-shadow:0 0 0 2px #b23 inset}
.qopts.reveal{pointer-events:none}
.qopts.reveal button:not(.ok):not(.no){opacity:.4}
.feedback{min-height:20px;font-size:12.5px;color:#888;text-align:center;line-height:1.6;margin-top:12px}
.gback{border:1px solid #ccd;background:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.ctx{font-size:13px;color:var(--pp);font-weight:700;margin-bottom:6px}

/* 결과 화면 */
.rtitle{text-align:center;font-size:19px;font-weight:700;margin-top:10px}
.rscore{text-align:center;color:#666;font-size:13.5px;margin:10px 0 20px}
.rbtns{display:flex;flex-direction:column;gap:10px}
.rbtns button{padding:13px;border:0;border-radius:10px;font-size:15px;background:var(--pp);color:#fff}
.rbtns button.ghost{background:#fff;color:var(--pp);border:1px solid #ddd}
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">가나 게임</h1>
  <span class="hstat" id="hdr-streak"></span>
  <button class="iconbtn" id="audio">🔊</button>
  <button class="iconbtn" id="reset">초기화</button>
</header>

<section id="view-home" class="active">
  <div class="card" style="margin-bottom:12px;font-size:13px;color:#666;line-height:1.6">
    모드를 골라 바로 시작하세요. 진행은 저장하지 않고 <b style="color:var(--pp)">매번 랜덤</b>으로 나와요.
    하트 3개, 시간 안에 정답을 맞혀 콤보와 점수를 쌓아보세요.
  </div>
  <div class="modelist" id="home-list"></div>
</section>

<section id="view-game">
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button class="gback" id="g-back">← 그만</button>
      <b id="g-title" style="font-size:13px;color:#666"></b>
    </div>
    <div class="ghud">
      <span class="hearts" id="g-hearts"></span>
      <span class="gcombo" id="g-combo"></span>
      <span class="gscore" id="g-score">0</span>
    </div>
    <div class="timerwrap"><div class="timerfill" id="g-timerfill"></div></div>
    <div class="prompt" id="g-prompt"></div>
    <div class="qopts" id="g-opts"></div>
    <div class="feedback" id="g-feedback"></div>
  </div>
</section>

<section id="view-result">
  <div class="card">
    <div class="rtitle" id="r-title"></div>
    <div class="rscore" id="r-score"></div>
    <div class="rbtns">
      <button id="r-retry">다시 도전</button>
      <button class="ghost" id="r-home">모드 선택</button>
    </div>
  </div>
</section>

// 가나 한 글자 → 한글 발음 (예문 후리가나용)
const KMAP={};
[GOJUON,DAKUTEN,YOUON].forEach(A=>A.forEach(e=>{KMAP[e.h]=e.ko;KMAP[e.k]=e.ko;}));
Object.assign(KMAP,{'ん':'ㄴ','ン':'ㄴ','っ':'ㅅ','ッ':'ㅅ','ー':''});
const COMBO={'フォ':'포','ファ':'파','フィ':'피','フェ':'페','チェ':'체','シェ':'셰','ジェ':'제',
  'ウィ':'위','ウェ':'웨','ウォ':'워','ティ':'티','ディ':'디'};
const SMALL=/[ゃゅょャュョぁぃぅぇぉァィゥェォ]/;
function furi(w){
  const out=[];
  for(const ch of w){
    if(SMALL.test(ch)&&out.length){const p=out[out.length-1];p.k+=ch;p.ko=KMAP[p.k]||COMBO[p.k]||p.ko;}
    else out.push({k:ch,ko:KMAP[ch]||''});
  }
  return out;
}
function wordHtml(w){
  return '<span class="furi">'+furi(w).map(t=>
    t.k===' ' ? '<span class="sp"></span>'
    : '<span class="fu"><span class="fr">'+t.ko+'</span><span class="fk">'+t.k+'</span></span>'
  ).join('')+'</span>';
}

  if(!('speechSynthesis'in window))return;
  const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>/ja[-_]?JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang))||null;
}
if('speechSynthesis'in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(t){
  if(!audioOn||!t||!('speechSynthesis'in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ja-JP'; u.rate=.8; if(jaVoice)u.voice=jaVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

const CONFUSE={shi:['tsu'],tsu:['shi'],so:['n'],n:['so'],nu:['me'],me:['nu'],
  wa:['re','ne'],re:['wa','ne'],ne:['re','wa'],ku:['wa'],ru:['ro'],ro:['ru'],
  a:['o'],o:['a'],ha:['ho'],ho:['ha'],ki:['sa'],sa:['ki']};

const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 모드 (진도 저장 없이 매번 랜덤) ---------- */
const MODES=[
  {id:'kana',name:'가나 스피드런',desc:'히라가나·가타카나 '+ALLKANA.length*2+'자, 끝없이 랜덤',icon:'⚡',pool:ALLKANA,type:'char'},
  {id:'word',name:'단어 서바이벌',desc:'여행 필수 단어 '+WORDPOOL.length+'개',icon:'🍙',pool:WORDPOOL,type:'word'},
  {id:'travel',name:'지명·역명 특급열차',desc:'도쿄·오사카·후쿠오카·삿포로',icon:'🚄',pool:TRAVELPOOL,type:'travel'},
  {id:'scene',name:'돌발 상황극',desc:'여행 중 상황에서 들려오는 실전 회화',icon:'🎭',pool:PHRASEPOOL,type:'scene'},
];
let BEST=JSON.parse(localStorage.getItem('kana_best')||'{}');
const saveBest=()=>localStorage.setItem('kana_best',JSON.stringify(BEST));

const today=new Date().toISOString().slice(0,10), DAY=864e5;
let meta=JSON.parse(localStorage.getItem('kana_meta')||'{}');
if(meta.last!==today){
  const cont=meta.last && Math.round((new Date(today)-new Date(meta.last))/DAY)===1;
  meta.streak=cont?(meta.streak||0)+1:1; meta.last=today;
  localStorage.setItem('kana_meta',JSON.stringify(meta));
}
function refreshHeader(){
  $('hdr-streak').textContent=meta.streak?('🔥 '+meta.streak+'일'):'';
}

/* ---------- 홈 화면 ---------- */
function showView(v){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
}
function renderHome(){
  showView('home');
  $('home-list').innerHTML=MODES.map(m=>
    '<div class="modecard" data-id="'+m.id+'">'
    +'<span class="micon">'+m.icon+'</span>'
    +'<span class="minfo"><b>'+m.name+'</b><br><small>'+m.desc+'</small></span>'
    +'<span class="mbest">'+(BEST[m.id]?'🏆 '+BEST[m.id]:'')+'</span>'
    +'</div>'
  ).join('');
  $('home-list').querySelectorAll('.modecard').forEach(el=>{
    el.onclick=()=>startMode(MODES.find(m=>m.id===el.dataset.id));
  });
  refreshHeader();
}

/* ---------- 스피드 매칭 게임 (엔드리스, 랜덤 출제) ---------- */
let play=null;
function pickDistractors(pool,ans,n){
  const rest=pool.filter(x=>x!==ans&&x.r!==ans.r);
  const conf=(CONFUSE[ans.r]||[]).map(r=>rest.find(x=>x.r===r)).filter(Boolean);
  const others=shuffle(rest.filter(x=>!conf.includes(x)));
  return shuffle([...conf,...others]).slice(0,n);
}
function pickMeaningDistractors(pool,ans,n){
  return shuffle(pool.filter(x=>x.ko!==ans.ko)).slice(0,n);
}
function feedbackText(item){
  if(play.type!=='char')return '';
  const {e,sc}=item;
  const mnemonic=sc==='h'?e.hm:e.km;
  const ex=sc==='h'?e.he:(e.ke&&e.ke!=='—'?e.ke:e.he);
  const exko=sc==='h'?e.heko:(e.ke&&e.ke!=='—'?e.keko:e.heko);
  let t='';
  if(mnemonic)t+='💡 '+mnemonic;
  if(ex&&ex!=='—')t+=(t?'<br>':'')+'예) '+ex+' — '+exko;
  return t;
}
function startMode(mode){
  play={mode,type:mode.type,lives:3,score:0,combo:0,comboMax:0,cur:null,correctEl:null,timer:null,lastRaw:null};
  $('g-title').textContent=mode.name;
  showView('game');
  updateGameHUD();
  nextQuestion();
}
function drawItem(){
  const pool=play.mode.pool;
  if(pool.length===1)return pool[0];
  let item;
  do{ item=pool[Math.random()*pool.length|0]; }while(item===play.lastRaw);
  play.lastRaw=item;
  return item;
}
function updateGameHUD(){
  $('g-hearts').textContent='❤️'.repeat(Math.max(0,play.lives))+'🖤'.repeat(3-Math.max(0,play.lives));
  $('g-score').textContent=play.score;
  const mult=Math.min(3,1+Math.floor((play.combo-1)/3));
  $('g-combo').textContent=play.combo>=3?('🔥x'+mult):'';
}
function nextQuestion(){
  $('g-feedback').innerHTML='';
  const raw=drawItem();
  play.cur=play.type==='char'?{e:raw,sc:Math.random()<0.5?'h':'k'}:raw;
  play.timeLimit=play.type==='char'?4000:(play.type==='scene'?7000:6500);
  play.qStart=Date.now();
  renderQuestion(play.cur);
  const bar=$('g-timerfill');
  bar.classList.remove('frozen');
  bar.style.transition='none';
  bar.style.width='100%';
  void bar.offsetWidth; // 강제 리플로우: transition 재시작이 안 먹는 버그 방지
  bar.style.transition='width '+play.timeLimit+'ms linear';
  bar.style.width='0%';
  play.timer=setTimeout(()=>answer(false,null),play.timeLimit);
}
function renderQuestion(item){
  const qo=$('g-opts'),prompt=$('g-prompt');
  qo.innerHTML='';qo.dataset.done='';qo.classList.remove('jpopts','reveal');
  if(play.type==='char'){
    const {e,sc}=item, flip=Math.random()<0.5;
    prompt.className='prompt'+(flip?' reading':' big');
    prompt.innerHTML=flip?(e.ko+'<small>('+e.r+')</small>'):(sc==='h'?e.h:e.k);
    if(!flip)speak(sc==='h'?e.h:e.k);
    play.speakOnAnswer=()=>speak(sc==='h'?e.h:e.k);
    const opts=shuffle([e,...pickDistractors(ALLKANA,e,3)]);
    if(flip)qo.classList.add('jpopts');
    opts.forEach(o=>{
      const b=document.createElement('button');
      b.textContent=flip?(sc==='h'?o.h:o.k):o.ko+' ('+o.r+')';
      if(o===e)play.correctEl=b;
      b.onclick=()=>answer(o===e,b);
      qo.appendChild(b);
    });
    return;
  }
  let ctx='';
  if(play.type==='travel'){
    ctx='<div class="ctx">🗾 '+item.city+'</div>';
  } else if(play.type==='scene'){
    const f=SCENARIO_FLAVOR[item.c]||{emoji:'💬',text:'현지에서 이런 말을 듣습니다.'};
    ctx='<div class="ctx">'+f.emoji+' '+f.text+'</div>';
  }
  prompt.className='prompt';
  prompt.innerHTML=ctx+wordHtml(item.jp);
  const cleanJp=item.jp.replace(/[ ・/○]/g,'');
  speak(cleanJp);
  play.speakOnAnswer=()=>speak(cleanJp);
  const opts=shuffle([item,...pickMeaningDistractors(play.mode.pool,item,3)]);
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o.ko;
    if(o===item)play.correctEl=b;
    b.onclick=()=>answer(o===item,b);
    qo.appendChild(b);
  });
}
function answer(ok,btn){
  const qo=$('g-opts');
  if(qo.dataset.done)return; // 클릭/타임아웃 동시 발생 등 중복 호출 방지
  qo.dataset.done='1';
  qo.classList.add('reveal');
  clearTimeout(play.timer);
  const bar=$('g-timerfill');
  const frozenWidth=getComputedStyle(bar).width; // 멈춘 시점의 실제 렌더 폭
  bar.style.transition='none';
  bar.style.width=frozenWidth; // 리셋 아님 — 남아있던 위치에서 그대로 정지
  bar.classList.add('frozen');
  if(ok){
    play.combo++;play.comboMax=Math.max(play.comboMax,play.combo);
    const mult=Math.min(3,1+Math.floor((play.combo-1)/3));
    const fast=(Date.now()-play.qStart)<play.timeLimit*0.5;
    play.score+=10*mult+(fast?5:0);
    if(btn)btn.classList.add('ok');
  } else {
    play.lives--;play.combo=0;
    if(btn)btn.classList.add('no');
    if(play.correctEl)play.correctEl.classList.add('ok');
    $('g-feedback').innerHTML=feedbackText(play.cur);
  }
  if(play.speakOnAnswer)play.speakOnAnswer();
  updateGameHUD();
  if(play.lives<=0){setTimeout(endSession,900);return;}
  setTimeout(nextQuestion,ok?500:1500);
}
function recordBest(){
  const id=play.mode.id;
  if(play.score>(BEST[id]||0)){BEST[id]=play.score;saveBest();}
}
function endSession(){
  recordBest();
  showView('result');
  $('r-title').textContent='게임 오버';
  $('r-score').textContent='점수 '+play.score+' · 최고 기록 '+BEST[play.mode.id]+' · 최대 콤보 '+play.comboMax+'연속';
  $('r-retry').onclick=()=>startMode(play.mode);
  $('r-home').onclick=renderHome;
  refreshHeader();
}
$('g-back').onclick=()=>{
  clearTimeout(play&&play.timer);
  if(play)recordBest();
  renderHome();
};

/* ---------- 헤더 ---------- */
$('reset').onclick=()=>{if(confirm('최고 기록을 모두 지울까요?')){BEST={};saveBest();renderHome();}};
$('audio').onclick=()=>{
  audioOn=!audioOn;localStorage.setItem('kana_audio',audioOn?'1':'0');
  $('audio').textContent=audioOn?'🔊':'🔇';
  if(audioOn)speak('こんにちは');
};
$('audio').textContent=audioOn?'🔊':'🔇';

renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
