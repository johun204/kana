<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>가나 집중 학습</title>
<style>
:root{
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --pp:#6c5ce7;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f5fb;color:#222;
  max-width:480px;margin:0 auto;padding-bottom:64px}
header{background:var(--pp);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:16px}
header .sub{font-size:11.5px;opacity:.92;margin-top:3px;line-height:1.55}
header .sub b{color:#ffe08a}
.bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center}
.pbar{flex:1 0 100%;height:6px;background:#e2e4f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--pp);width:0;transition:width .3s}
.bar #stat{font-size:12px;color:#555}
.bar #streak{margin-left:auto;font-size:12px}
section{display:none;padding:8px 16px 24px}
section.active{display:block}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.big{display:flex;gap:30px;justify-content:center;margin-bottom:4px}
.kunit{display:flex;flex-direction:column;align-items:center;line-height:1}
.kana{font-family:var(--jp);font-size:86px}
.kana.kk{color:#8a8fb0}
.kread{font-size:15px;color:var(--pp);margin-top:6px;font-weight:700}
.rom{text-align:center;font-size:14px;color:#666;margin:8px 0 2px}
.rom b{color:var(--pp);font-size:16px}
.lsc{text-align:center;color:var(--pp);font-size:13px;margin-bottom:8px}
.nu{background:#ffe08a;color:#7a5b00;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;vertical-align:middle;margin-right:6px}
.mn{font-size:14px;line-height:1.6;background:#f6f6fd;border-radius:10px;padding:10px 12px;margin:10px 0}
.mn .tip{color:#555}
.mn b{color:var(--pp)}
.ex{font-size:14px;line-height:2.7}
.ex .tip{color:#888;line-height:1.6}
.furi{display:inline-flex;align-items:flex-end;gap:1px;vertical-align:middle;margin:0 2px}
.fu{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.fr{font-size:9.5px;color:var(--pp);height:12px}
.fk{font-family:var(--jp);font-size:20px}
.mark{display:flex;gap:10px;margin-top:14px}
.mark button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px}
#lkno{background:#e3fbe8;color:#1a7a33}
#lfgt{background:#ffe9e9;color:#b23}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.nav2 button{padding:8px 14px;border:1px solid #ccd;background:#fff;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}
.grid span{font-family:var(--jp);font-size:19px;text-align:center;padding:6px 0;border-radius:8px;
  background:#fff;border:1px solid #e2e4f0;color:#999}
.grid span.sw{background:#fff7e6;border-color:#f0d9a8;color:#b07d18}
.grid span.kn{background:#e3fbe8;border-color:#a9e6b8;color:#1a7a33}
.grid span.cur{outline:2px solid var(--pp)}
.gridleg{margin-top:10px;font-size:11px;color:#999;text-align:center}
.qmeta{text-align:center;color:#666;font-size:13px;margin-top:2px;min-height:18px}
.prompt{text-align:center;font-size:34px;margin:10px 0 2px}
.prompt small{font-size:16px;color:#888}
.scriptask{text-align:center;color:var(--pp);font-size:14px;margin-bottom:4px}
.pad{position:relative;width:min(300px,86vw);height:min(300px,86vw);margin:10px auto;
  border:2px dashed #cdd3e8;border-radius:16px;background:#fff;touch-action:none}
.guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--jp);
  font-size:min(210px,60vw);line-height:1;color:#eceefb;pointer-events:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.row{display:flex;gap:10px;justify-content:center;margin-top:6px}
.row button{padding:10px 16px;border:1px solid #ccd;background:#fff;border-radius:10px;font-size:14px}
#bscore{background:var(--pp);color:#fff;border:0}
.result{text-align:center;font-size:16px;margin-top:10px;min-height:22px;font-weight:600}
.result.good{color:#1a7a33}
.result.bad{color:#b23}
.qq{font-family:var(--jp);font-size:80px;text-align:center;margin:20px 0}
.qq.small{font-family:inherit;font-size:30px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopts button{padding:16px;font-size:18px;border:1px solid #ccd;background:#fff;border-radius:12px;font-family:var(--jp)}
.qopts button.ok{background:#e3fbe8;border-color:#1a7a33}
.qopts button.no{background:#ffe9e9;border-color:#b23}
.hint{text-align:center;color:#999;font-size:12px;margin-top:8px;line-height:1.5}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;
  background:#fff;border-top:1px solid #e0e0ea}
nav button{flex:1;padding:12px 0;border:0;background:none;font-size:14px;color:#888}
nav button.on{color:var(--pp);font-weight:700}
.tinybtn{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>가나 집중 학습 <button class="tinybtn" id="reset">기록 초기화</button></h1>
  <div class="sub"><b>간격 반복(SRS)</b>으로 복습 시점을 자동 관리 · <b>양방향 인출</b>(모양↔소리) · <b>직접 쓰기</b> · <b>혼동쌍 섞기</b>. 5분이든 20분이든 원하는 만큼.</div>
</header>

<div class="bar">
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
  <span id="stat"></span>
  <span id="streak"></span>
</div>

<section id="view-learn" class="active">
  <div class="card">
    <div class="big">
      <div class="kunit"><span class="kana" id="lhh"></span><span class="kread" id="lhr"></span></div>
      <div class="kunit"><span class="kana kk" id="lkk"></span><span class="kread" id="lkr"></span></div>
    </div>
    <div class="rom" id="lrom"></div>
    <div class="lsc" id="lsc"></div>
    <div class="mn" id="lmn"></div>
    <div class="ex" id="lex"></div>
    <div class="mark">
      <button id="lkno">✓ 외웠어요</button>
      <button id="lfgt">✗ 다시</button>
    </div>
    <div class="nav2">
      <button id="lprv">← 이전</button>
      <button id="lnxt">다음 (채점 안 함) →</button>
    </div>
    <div class="grid" id="lgrid"></div>
    <div class="gridleg">지금 열린 글자 · <span style="color:#b07d18">노랑=복습 중</span> · <span style="color:#1a7a33">초록=정착</span></div>
  </div>
</section>

<section id="view-practice">
  <div class="card">
    <div class="qmeta" id="pmeta">이번 세션: 0 / 0</div>

    <div id="pquiz">
      <div class="qq" id="qq"></div>
      <div class="qopts" id="qo"></div>
    </div>

    <div id="pwrite" hidden>
      <div class="prompt" id="bp"></div>
      <div class="scriptask" id="bsa"></div>
      <div class="pad"><div class="guide" id="bg"></div><canvas id="bc" width="300" height="300"></canvas></div>
      <div class="row">
        <button id="bclr">지우기</button>
        <button id="bscore">채점</button>
        <button id="bnext" hidden>다음 →</button>
      </div>
      <div class="result" id="br"></div>
      <div class="hint">소리를 보고 백지에 직접 써 보세요. 60% 이상이면 정답.</div>
    </div>
  </div>
</section>

<nav>
  <button data-v="learn" class="on">학습</button>
  <button data-v="practice">연습</button>
</nav>

<script>
const JP='"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif';

// 청음 46 — h|k|romaji|korean|히라연상|가타연상|히라예|한글발음|뜻|가타예|한글발음|뜻
const GOJUON=`
あ|ア|a|아|알파벳 A에 획 하나 더 — 입 크게 '아!'|각진 A, 도끼 모양 '아'|あめ|아메|비|アイス|아이스|아이스크림

ぬ|ヌ|nu|누|국수(누들)를 젓가락으로 돌돌 — 꼬리 있음(め와 구분)|한자 又에 삐침, 국수 '누'|いぬ|이누|개|ヌードル|누도루|누들
ね|ネ|ne|네|고양이(ねこ) 꼬리 말린 모양 — ね·れ·わ 세 자매|복잡한 십자, 제사상 '네'|ねこ|네코|고양이|ネクタイ|네쿠타이|넥타이
の|ノ|no|노|동그랗게 도는 'no' 사인, 소용돌이|삐침 하나, 슬래시 '노'|のみもの|노미모노|음료|ノート|노토|공책

ひ|ヒ|hi|히|웃는 입꼬리 옆모습 '히'|숟가락, 한자 匕(비수 비) '히'|ひこうき|히코우키|비행기|ヒーロー|히로|히어로
ふ|フ|fu|후|후지산 실루엣, '후~' 부는 바람|갈고리 하나, '후~' 부는 입|ふゆ|후유|겨울|フォーク|포크|포크
へ|ヘ|he|헤|산 능선 — 방귀(へ) 소리 '헤~'|히라가나 へ와 똑같음, 산 능선|へや|헤야|방|ヘア|헤아|헤어
ほ|ホ|ho|호|'は'에 획 하나 더 — 돛단배의 돛|한자 木(나무 목)에 점, 돛대 '호'|ほし|호시|별|ホテル|호테루|호텔
ま|マ|ma|마|실타래 감는 모양 — 엄마가 뜨개질|삼각 매듭, 마스크 '마'|まど|마도|창문|マスク|마스쿠|마스크
み|ミ|mi|미|숫자 3처럼 구불구불 '미'|가로줄 세 개, 숫자 3 '미'|みず|미즈|물|ミルク|미루쿠|우유

ゆ|ユ|yu|유|물고기가 구부러진 몸통으로 헤엄|그릇 모양, U턴 '유'|ゆき|유키|눈(雪)|ユーモア|유모아|유머

// 가나 한 글자 → 한글 발음
const KMAP={};
[GOJUON,DAKUTEN,YOUON].forEach(A=>A.forEach(e=>{KMAP[e.h]=e.ko;KMAP[e.k]=e.ko;}));
Object.assign(KMAP,{'ん':'ㄴ','ン':'ㄴ','っ':'ㅅ','ッ':'ㅅ','ー':''});
const SMALL=/[ゃゅょャュョ]/;
function furi(w){
  const out=[];
  for(const ch of w){
    if(SMALL.test(ch)&&out.length){const p=out[out.length-1];p.k+=ch;p.ko=KMAP[p.k]||p.ko;}
    else out.push({k:ch,ko:KMAP[ch]||''});
  }
  return out;
}
function wordHtml(w){
  return '<span class="furi">'+furi(w).map(t=>
    '<span class="fu"><span class="fr">'+t.ko+'</span><span class="fk">'+t.k+'</span></span>').join('')+'</span>';
}
function exHtml(e){
  let s='';
  if(e.he&&e.he!=='—') s+='예 '+wordHtml(e.he)+' &mdash; '+e.hek;
  else s+='<span class="tip">'+e.hek+'</span>';
  if(e.ke&&e.ke!=='—') s+='<br>예 '+wordHtml(e.ke)+' &mdash; '+e.kek;
  return s;
}

/* ---------- SRS (라이트너 확장 간격) ---------- */
const MIN=6e4,HOUR=36e5,DAY=864e5;
const IVL=[MIN,10*MIN,HOUR,5*HOUR,DAY,3*DAY]; // box 0~5 다음 복습까지
let DB=JSON.parse(localStorage.getItem('kana_srs')||'null');
if(!DB){ // 이전 버전(streak) 마이그레이션
  DB={};
  const old=JSON.parse(localStorage.getItem('kana_prog')||'{}');
  for(const k in old){const s=+old[k]||0;DB[k]={b:s>=3?4:s,due:0,seen:1};}
}
const save=()=>localStorage.setItem('kana_srs',JSON.stringify(DB));
const pk=it=>it.sc+':'+it.e.r;
const chOf=it=>it.sc==='h'?it.e.h:it.e.k;
const boxOf=it=>{const r=DB[pk(it)];return r?r.b:-1;};
const isMastered=it=>boxOf(it)>=4;
function gradeKey(key,ok,fast){
  const r=DB[key]||{b:0,seen:0};
  r.seen=(r.seen||0)+1;
  if(ok)r.b=Math.min(5,r.b+(fast===false?0:1)); // 느리게 맞히면 상자 유지(유창성)
  else r.b=Math.max(0,r.b-2);
  r.due=Date.now()+IVL[r.b];
  DB[key]=r;
}

const $=id=>document.getElementById(id);
const today=new Date().toISOString().slice(0,10);
let meta=JSON.parse(localStorage.getItem('kana_meta')||'{}');
if(meta.last!==today){
  const cont=meta.last && Math.round((new Date(today)-new Date(meta.last))/DAY)===1;
  meta.streak=cont?(meta.streak||0)+1:1; meta.last=today;
  localStorage.setItem('kana_meta',JSON.stringify(meta));
}

let session=0, lastKey=null, qsess={c:0,t:0};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function masteredCount(){return CURRICULUM.reduce((n,it)=>n+(isMastered(it)?1:0),0);}
function unlockedN(){return Math.min(CURRICULUM.length,8+masteredCount());} // 익힌 만큼만 새 글자 개방
function unlockedList(){return CURRICULUM.slice(0,unlockedN());}

// 스케줄러: 복습 예정 → 새 글자 → 가장 가까운 예정
function nextItem(){
  const now=Date.now(), U=unlockedList();
  let due=U.filter(it=>{const r=DB[pk(it)];return r&&r.due<=now&&pk(it)!==lastKey;})
           .sort((a,b)=>DB[pk(a)].due-DB[pk(b)].due);
  if(due.length){lastKey=pk(due[0]);return due[0];}
  const fresh=U.find(it=>DB[pk(it)]===undefined);
  if(fresh){lastKey=pk(fresh);return fresh;}
  const up=U.filter(it=>pk(it)!==lastKey).sort((a,b)=>(DB[pk(a)].due||0)-(DB[pk(b)].due||0));
  const it=up[0]||U[0]; lastKey=pk(it); return it;
}
function commit(){save();updateStats();}
function updateStats(){
  const m=masteredCount(),tot=CURRICULUM.length;
  $('pfill').style.width=(m/tot*100).toFixed(1)+'%';
  $('stat').textContent='정착 '+m+' / '+tot+' · 이번 세션 '+session;
  $('streak').textContent=meta.streak?('🔥 '+meta.streak+'일'):'';
  if($('view-learn').classList.contains('active'))renderGrid();
}

/* ---------- 캔버스 ---------- */
function bindPad(cv){
  const ctx=cv.getContext('2d');
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=16;ctx.strokeStyle='#1e2b4d';
  let drawing=false,last=null,dirty=false;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dirty=true;});
  const end=()=>drawing=false;
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,end));
  return{ctx,clear(){ctx.clearRect(0,0,cv.width,cv.height);dirty=false;},get dirty(){return dirty;}};
}
// ponytail: 유사도 = 실제 글자 글리프와 손글씨의 픽셀 겹침 F1. 획 순서/모양은 안 봄.
function similarity(cv,ch){
  const W=cv.width,H=cv.height;
  const off=document.createElement('canvas');off.width=W;off.height=H;
  const o=off.getContext('2d');
  o.fillStyle='#000';o.textAlign='center';o.textBaseline='middle';
  o.font=(ch.length>1?140:220)+'px '+JP;
  o.fillText(ch,W/2,H/2);
  const T=o.getImageData(0,0,W,H).data, U=cv.getContext('2d').getImageData(0,0,W,H).data;
  let inter=0,t=0,u=0;
  for(let i=3;i<T.length;i+=4){const tp=T[i]>40,up=U[i]>40;if(tp)t++;if(up)u++;if(tp&&up)inter++;}
  if(!t||!u)return 0;
  const cov=inter/t, prec=inter/u;
  return Math.round(100*2*cov*prec/(cov+prec));
}
const guideSize=ch=>ch.length>1?'min(140px,40vw)':'';

/* ---------- 연습 (퀴즈 + 백지쓰기 랜덤 혼합) ---------- */
const bpad=bindPad($('bc'));
const CONFUSE={shi:['tsu'],tsu:['shi'],so:['n'],n:['so'],nu:['me'],me:['nu'],
  wa:['re','ne'],re:['wa','ne'],ne:['re','wa'],ku:['wa'],ru:['ro'],ro:['ru'],
  a:['o'],o:['a'],ha:['ho'],ho:['ha'],ki:['sa'],sa:['ki']};
let pItem,pCh,qStart=0;
function nextRound(){
  pItem=nextItem(); pCh=chOf(pItem);
  const write=Math.random()<0.4;
  $('pquiz').hidden=write; $('pwrite').hidden=!write;
  write?renderWrite():renderQuiz();
}
function distractors(ans){
  const same=unlockedList().filter(it=>it.sc===ans.sc&&it.e.r!==ans.e.r&&it.e.ko!==ans.e.ko);
  const conf=(CONFUSE[ans.e.r]||[]).flatMap(r=>same.filter(it=>it.e.r===r));
  const rest=shuffle(same.filter(it=>!conf.includes(it)));
  return [...conf,...rest].slice(0,3);
}
function renderQuiz(){
  const ans=pItem,sc=ans.sc,modeB=Math.random()<.5;
  const opts=shuffle([ans,...distractors(ans)]);
  const qq=$('qq'),qo=$('qo');
  qq.classList.toggle('small',modeB);
  qq.textContent=modeB?ans.e.ko+' ('+ans.e.r+')':(sc==='h'?ans.e.h:ans.e.k);
  qo.innerHTML='';qo.dataset.done='';qStart=Date.now();
  opts.forEach(it=>{
    const btn=document.createElement('button');
    btn.textContent=modeB?(sc==='h'?it.e.h:it.e.k):it.e.ko+' ('+it.e.r+')';
    btn.onclick=()=>{
      if(qo.dataset.done)return;qo.dataset.done='1';qsess.t++;
      const ok=it===ans, fast=Date.now()-qStart<5000;
      if(ok){btn.classList.add('ok');qsess.c++;gradeKey(pk(ans),true,fast);}
      else{btn.classList.add('no');gradeKey(pk(ans),false);
        [...qo.children].forEach((c,i)=>{if(opts[i]===ans)c.classList.add('ok');});}
      session++;commit();
      $('pmeta').textContent='이번 세션: '+qsess.c+' / '+qsess.t+(ok&&!fast?'  · 조금 더 빠르게!':'');
      setTimeout(nextRound,ok?800:1150);
    };
    qo.appendChild(btn);
  });
}
function renderWrite(){
  $('bp').innerHTML=pItem.e.ko+' <small>('+pItem.e.r+')</small>';
  $('bsa').textContent='→ '+(pItem.sc==='h'?'ひらがな':'カタカナ')+'로 쓰기';
  $('bg').textContent='';$('bg').style.fontSize=guideSize(pCh);
  bpad.clear();
  $('br').textContent='';$('br').className='result';
  $('bnext').hidden=true;$('bscore').hidden=false;
}
$('bclr').onclick=()=>bpad.clear();
$('bnext').onclick=nextRound;
$('bscore').onclick=()=>{
  if(!bpad.dirty){$('br').textContent='먼저 써 보세요';return;}
  const s=similarity($('bc'),pCh),ok=s>=60;
  $('bg').textContent=pCh;
  $('br').textContent='유사도 '+s+'%   ·   정답 '+pCh;
  $('br').className='result '+(ok?'good':'bad');
  qsess.t++;if(ok)qsess.c++;
  gradeKey(pk(pItem),ok,true);
  session++;commit();
  $('pmeta').textContent='이번 세션: '+qsess.c+' / '+qsess.t;
  $('bnext').hidden=false;$('bscore').hidden=true;
  if(ok)setTimeout(()=>{if(!$('bnext').hidden)nextRound();},1300);
};

/* ---------- 라우팅 ---------- */
const views={learn:()=>learnShow(cur||nextItem()),practice:nextRound};
document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick=()=>{
    const v=btn.dataset.v;
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===btn));
    document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
    views[v]();
  };
});
const refreshActive=()=>views[document.querySelector('section.active').id.replace('view-','')]();
$('reset').onclick=()=>{if(confirm('학습 기록을 모두 지울까요?')){DB={};cur=null;hist=[];session=0;qsess={c:0,t:0};commit();refreshActive();}};

learnShow(nextItem()); updateStats();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
